<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<title>BestOne in Japan</title>
<meta name="description" content="어린왕자와 코끼리의 일본 여행 - 두 사람이 함께 쓰는 여행 기록 앱" />
<meta name="theme-color" content="#1b2a4a" />
<meta name="format-detection" content="telephone=no" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BestOne" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<!-- 폰트: Pretendard -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- =========================================================
     로그인 화면
========================================================= -->
<div id="loginScreen" class="login-screen" role="main" aria-label="로그인">
  <div class="login-sky" aria-hidden="true">
    <div class="stars"></div>
    <svg class="login-art" viewBox="0 0 400 260" role="img" aria-label="사막 위의 작은 여행자와 코끼리를 품은 언덕">
      <defs>
        <linearGradient id="duneG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8d3a9" />
          <stop offset="100%" stop-color="#c9ab77" />
        </linearGradient>
        <linearGradient id="duneG2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d8bd8e" />
          <stop offset="100%" stop-color="#b2915e" />
        </linearGradient>
      </defs>
      <!-- 달 -->
      <circle cx="330" cy="52" r="24" fill="#f6e3a1" opacity="0.95" />
      <circle cx="321" cy="46" r="20" fill="#1b2a4a" />
      <!-- 별자리 -->
      <g stroke="#f2c14e" stroke-width="1" opacity="0.75" fill="none">
        <polyline points="40,40 66,26 96,44 124,30" />
      </g>
      <g fill="#f6e3a1">
        <circle cx="40" cy="40" r="2.6" /><circle cx="66" cy="26" r="2" />
        <circle cx="96" cy="44" r="2.6" /><circle cx="124" cy="30" r="2" />
        <circle cx="190" cy="34" r="1.8" /><circle cx="240" cy="70" r="1.6" />
        <circle cx="150" cy="80" r="1.4" /><circle cx="280" cy="26" r="1.6" />
      </g>
      <!-- 비행기 -->
      <g transform="translate(232,104) rotate(-12)" fill="#f4efe2" opacity="0.9">
        <path d="M0 0 L26 4 L34 0 L26 -4 Z" />
        <path d="M12 2 L6 12 L10 12 L18 3 Z" />
        <path d="M12 -2 L6 -12 L10 -12 L18 -3 Z" />
      </g>
      <!-- 사막 언덕 (코끼리를 삼킨 보아뱀 실루엣) -->
      <path d="M0 260 L0 214 C40 214 60 210 84 198 C104 188 118 156 148 156 C178 156 190 188 212 198 C236 210 262 214 400 214 L400 260 Z"
            fill="url(#duneG)" />
      <path d="M0 260 L0 238 C70 238 110 232 168 226 C230 220 300 232 400 230 L400 260 Z"
            fill="url(#duneG2)" opacity="0.9" />
      <!-- 작은 여행자 + 여행 가방 -->
      <g transform="translate(300,196)" fill="#2b3a5c">
        <circle cx="0" cy="-22" r="6" />
        <path d="M-5 -16 L5 -16 L7 -2 L-7 -2 Z" />
        <path d="M-7 -2 L-4 12 L-1 12 L-2 -2 Z" />
        <path d="M7 -2 L4 12 L1 12 L2 -2 Z" />
        <rect x="8" y="0" width="12" height="9" rx="1.5" />
        <path d="M11 0 v-3 h6 v3" fill="none" stroke="#2b3a5c" stroke-width="1.6" />
      </g>
    </svg>
  </div>

  <div class="login-card">
    <h1 class="brand">
      <span class="brand-main">BestOne <span class="brand-in">in</span> <span id="brandCountry">Japan</span></span>
      <span class="brand-sub" id="brandSubtitle">«어린왕자와 코끼리의 일본 여행»</span>
    </h1>

    <form id="loginForm" autocomplete="on" novalidate>
      <label class="field">
        <span class="field-label">여행 코드</span>
        <input type="text" id="loginTripCode" name="tripcode" inputmode="text"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="여행 코드" aria-label="여행 코드" />
      </label>

      <label class="field">
        <span class="field-label">비밀번호</span>
        <input type="password" id="loginPassword" name="password"
               autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required />
      </label>

      <div class="field">
        <span class="field-label">누구신가요?</span>
        <div class="user-pick" id="userPick" role="group" aria-label="사용자 선택"></div>
        <input type="text" id="loginNickname" placeholder="또는 닉네임 직접 입력"
               aria-label="닉네임 직접 입력" autocomplete="username" />
      </div>

      <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
        <span class="btn-text">여행 시작하기</span>
      </button>
      <p class="login-msg" id="loginMsg" role="status" aria-live="polite"></p>
    </form>

    <p class="login-hint">
      비밀번호는 이 화면에도, 코드에도 저장되지 않습니다.<br />
      서버(Apps Script)에서만 확인합니다.
    </p>
  </div>
</div>

<!-- =========================================================
     앱 본체
========================================================= -->
<div id="app" class="app hidden">

  <header class="app-header">
    <div class="header-left">
      <svg class="logo-mark" viewBox="0 0 48 48" role="img" aria-label="BestOne 로고">
        <circle cx="24" cy="24" r="23" fill="#1b2a4a" />
        <path d="M6 34 C12 34 15 30 20 27 C24 24.5 27 27 31 29.5 C35 32 38 34 42 34 L42 40 L6 40 Z" fill="#e8d3a9" />
        <circle cx="34" cy="14" r="5" fill="#f2c14e" />
        <circle cx="31" cy="12" r="4" fill="#1b2a4a" />
        <circle cx="14" cy="13" r="1.6" fill="#f6e3a1" />
        <circle cx="20" cy="19" r="1.2" fill="#f6e3a1" />
        <circle cx="9" cy="22" r="1.1" fill="#f6e3a1" />
      </svg>
      <div class="header-title">
        <span class="header-main">BestOne <span class="brand-in">in</span> <span class="header-country">Japan</span></span>
        <span class="header-sub" id="headerSub">«어린왕자와 코끼리의 일본 여행»</span>
      </div>
    </div>
    <div class="header-right">
      <span class="net-dot" id="netDot" title="네트워크 상태" aria-live="polite"></span>
      <button type="button" class="icon-btn" id="searchBtn" aria-label="전체 검색" title="전체 검색">
        <span aria-hidden="true">🔍</span>
      </button>
      <button type="button" class="icon-btn" id="refreshBtn" aria-label="새로고침" title="새로고침">
        <span aria-hidden="true">⟳</span>
      </button>
      <button type="button" class="icon-btn" id="menuBtn" aria-label="설정 메뉴" title="설정">
        <span aria-hidden="true">☰</span>
      </button>
    </div>
  </header>

  <div class="sync-bar" id="syncBar">
    <span id="syncText">동기화 준비 중…</span>
    <span class="sync-me" id="syncMe"></span>
  </div>

  <main class="app-main" id="appMain">
    <section class="view" id="view-today"   role="tabpanel" aria-label="오늘"></section>
    <section class="view hidden" id="view-schedule" role="tabpanel" aria-label="일정"></section>
    <section class="view hidden" id="view-booking"  role="tabpanel" aria-label="예약"></section>
    <section class="view hidden" id="view-local"    role="tabpanel" aria-label="현지"></section>
    <section class="view hidden" id="view-record"   role="tabpanel" aria-label="기록"></section>
  </main>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="주요 메뉴">
    <button type="button" class="tab-btn active" data-tab="today" role="tab" aria-selected="true" aria-label="오늘">
      <span class="tab-ico" aria-hidden="true">☀️</span><span class="tab-label">오늘</span>
    </button>
    <button type="button" class="tab-btn" data-tab="schedule" role="tab" aria-selected="false" aria-label="일정">
      <span class="tab-ico" aria-hidden="true">🗓️</span><span class="tab-label">일정</span>
    </button>
    <button type="button" class="tab-btn" data-tab="booking" role="tab" aria-selected="false" aria-label="예약">
      <span class="tab-ico" aria-hidden="true">🎟️</span><span class="tab-label">예약</span>
    </button>
    <button type="button" class="tab-btn" data-tab="local" role="tab" aria-selected="false" aria-label="현지">
      <span class="tab-ico" aria-hidden="true">🗾</span><span class="tab-label">현지</span>
    </button>
    <button type="button" class="tab-btn" data-tab="record" role="tab" aria-selected="false" aria-label="기록">
      <span class="tab-ico" aria-hidden="true">📖</span><span class="tab-label">기록</span>
    </button>
  </nav>
</div>

<!-- =========================================================
     공통 UI (바텀시트 / 모달 / 토스트 / 뷰어)
========================================================= -->
<div class="sheet-backdrop hidden" id="sheetBackdrop" tabindex="-1">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <span class="sheet-grip" aria-hidden="true"></span>
      <h2 class="sheet-title" id="sheetTitle">제목</h2>
      <button type="button" class="icon-btn sheet-close" id="sheetClose" aria-label="닫기">
        <span aria-hidden="true">✕</span>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<div class="confirm-backdrop hidden" id="confirmBackdrop">
  <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <h3 id="confirmTitle">확인</h3>
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button type="button" class="btn btn-ghost" id="confirmCancel">취소</button>
      <button type="button" class="btn btn-danger" id="confirmOk">확인</button>
    </div>
  </div>
</div>

<div class="viewer hidden" id="viewer" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
  <button type="button" class="viewer-close icon-btn" id="viewerClose" aria-label="닫기">
    <span aria-hidden="true">✕</span>
  </button>
  <div class="viewer-inner" id="viewerInner"></div>
</div>

<div class="bigtext hidden" id="bigText" role="dialog" aria-modal="true" aria-label="큰 글씨 보기">
  <button type="button" class="viewer-close icon-btn" id="bigTextClose" aria-label="닫기">
    <span aria-hidden="true">✕</span>
  </button>
  <div class="bigtext-inner">
    <p class="bigtext-main" id="bigTextMain"></p>
    <p class="bigtext-sub" id="bigTextSub"></p>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>

<div class="loading-overlay hidden" id="loadingOverlay" aria-hidden="true">
  <div class="loading-planet"></div>
  <p id="loadingText">불러오는 중…</p>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
